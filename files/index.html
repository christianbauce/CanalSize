<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CanalSize - La canala giusta al primo calcolo</title>
<meta name="theme-color" content="#1d4778"><meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CanalSize"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --blu:#1d4778; --blu-chiaro:#e8eef6; --sfondo:#e9edf2; --carta:#fff; --testo:#1c2430; --grigio:#667085;
  --bordo:#cfd6df; --rosso:#c62828; --verde:#2e8b3d; --arancio:#d98200; --azione:#1f5fbf;
  --raggio:12px; --ombra:0 1px 2px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);
  font:16px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h2{font-size:17px;margin:0 0 10px;color:var(--blu)}
button,input,select{font:inherit;color:inherit}
input[type=text],input[type=number],select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bordo);
  border-radius:10px;background:#fff;appearance:none;-webkit-appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%23667085' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
label.et{display:block;font-size:13px;color:var(--grigio);margin:0 0 4px}
.rosso{color:var(--rosso);font-weight:700}
.piccolo{font-size:12.5px;color:var(--grigio)}
.nascosto{display:none!important}

/* intestazione app */
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--carta);
  box-shadow:var(--ombra);position:sticky;top:0;z-index:20}
.top img{width:46px;height:46px;border-radius:10px}
.top .nome{font-size:20px;font-weight:800;color:var(--blu);line-height:1.1}
.top .slogan{font-size:12.5px;color:var(--grigio)}
.top .db{margin-left:auto;text-align:right;font-size:11.5px;color:var(--grigio);max-width:46%}
.top .db b{display:block;color:var(--testo);font-weight:600}

main{display:grid;gap:12px;padding:12px;max-width:1200px;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .col-dx{position:sticky;top:78px}}
.card{background:var(--carta);border-radius:var(--raggio);box-shadow:var(--ombra);padding:14px;margin-bottom:12px}
.col-sx>.card:last-child,.col-dx>.card:last-child{margin-bottom:0}
details.card>summary{list-style:none;cursor:pointer;font-size:17px;font-weight:700;color:var(--blu);
  display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--grigio)}
details.card:not([open])>summary::after{content:"▸"}
details.card[open]>summary{margin-bottom:10px}
.griglia{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.span2{grid-column:span 2}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:6px 14px;border:1px solid var(--bordo);
  border-radius:999px;background:#fff;user-select:none}
.chip input:checked+span{background:var(--azione);border-color:var(--azione);color:#fff;font-weight:600}
.chip input:focus-visible+span{outline:3px solid #9ec1f2}
.legenda{margin-top:6px}

.stepper{display:flex;align-items:stretch;gap:6px}
.stepper input{text-align:center;min-width:64px;width:84px}
.stepper button,.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--bordo);border-radius:10px;
  background:#fff;font-weight:700;cursor:pointer}
.btn.primario{background:var(--azione);border-color:var(--azione);color:#fff}
.btn.pericolo{color:var(--rosso)}
.btn:active,.stepper button:active{filter:brightness(.93)}
.riga-azione{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.riga-azione .cresce{flex:1 1 140px}

.lista{display:grid;gap:8px}
.cavo{display:grid;grid-template-columns:14px 1fr auto auto;grid-template-areas:"sw tt st x";gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bordo);
  border-radius:10px;cursor:pointer}
.cavo .sw{grid-area:sw}.cavo .tt{grid-area:tt}.cavo .stepper{grid-area:st}.cavo .x{grid-area:x}
@media(max-width:560px){.cavo{grid-template-columns:14px 1fr auto;grid-template-areas:"sw tt x" ". st st"}
  .cavo .stepper{justify-content:flex-start}}
.cavo.sel{border-color:var(--azione);background:var(--blu-chiaro)}
.cavo .sw{width:14px;height:14px;border-radius:50%;border:1px solid #222}
.cavo .tt{min-width:0}.cavo .tt b{display:block;overflow-wrap:anywhere}
.cavo .tt span{font-size:12.5px;color:var(--grigio)}
.cavo .stepper input{width:58px;min-width:58px;min-height:38px}
.cavo .stepper button{min-height:38px;min-width:38px;padding:0}
.cavo .x{min-height:38px;min-width:38px;border:none;background:none;font-size:20px;color:var(--grigio)}
.vuoto{padding:14px;text-align:center;color:var(--grigio)}
.barra-lista{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}

#boxImg{text-align:center}
#boxImg img{max-width:100%;max-height:150px}
#boxImg .titolo{font-size:13px;color:var(--grigio);margin-bottom:6px}

.perc{font-size:34px;font-weight:800;line-height:1.1}
.barra{height:12px;background:#e6e6e6;border-radius:6px;overflow:hidden;margin:8px 0 10px}
.barra i{display:block;height:100%}
.pesi div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.pesi .tot{font-weight:800;border-top:1px solid var(--bordo);margin-top:4px;padding-top:6px}
#svgBox svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.legenda-cavi{display:grid;gap:4px;margin-top:8px;font-size:14px}
.legenda-cavi span i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #222;margin-right:8px;vertical-align:-1px}
#fuori{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--rosso);font-weight:800;text-transform:uppercase}
#fuori img{width:54px;height:auto}

/* barra azioni in basso */
.azioni{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:6px;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);box-shadow:0 -1px 6px rgba(16,24,40,.15)}
.azioni button{flex:1 1 0;max-width:150px;min-height:48px;border:1px solid var(--bordo);border-radius:10px;background:#fff;
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.azioni button span{font-size:19px;line-height:1}
.azioni button.p{background:var(--azione);border-color:var(--azione);color:#fff}

/* finestre di dialogo */
dialog{border:none;border-radius:14px;padding:0;max-width:min(92vw,460px);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(16,24,40,.5)}
dialog .corpo{padding:18px 18px 8px}
dialog h3{margin:0 0 8px;font-size:18px;color:var(--blu)}
dialog h3.att{color:var(--rosso)}
dialog .testo{white-space:pre-line;overflow-wrap:anywhere;max-height:55vh;overflow:auto}
dialog .bott{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px}

#progresso{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:60;display:flex;align-items:center;justify-content:center}
#progresso .box{background:#fff;border-radius:14px;padding:18px;width:min(88vw,380px)}
#progresso .barra{height:14px;margin:12px 0 6px}
#progresso .barra i{background:var(--azione);width:0;transition:width .12s}

#splash{position:fixed;inset:0;background:var(--sfondo);z-index:100;display:flex;align-items:center;justify-content:center;
  transition:opacity .45s}
#splash img{width:min(72vw,360px);height:auto}
#splash.via{opacity:0;pointer-events:none}

#stampa{display:none}

/* ---------------- stampa: A4 orizzontale ---------------- */
@page{size:A4 landscape;margin:12mm 12mm 16mm 12mm;
  @bottom-right{content:"Pagina " counter(page) " di " counter(pages);font:9pt "Segoe UI",Arial,sans-serif;color:#777}}
@media print{
  html,body{background:#fff;padding:0;font-size:10pt}
  body>*:not(#stampa){display:none!important}
  #stampa{display:block;color:#111}
  #stampa .pag-testa{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:.3mm solid #999;padding-bottom:2mm;margin-bottom:3mm}
  #stampa h1{font-size:19pt;margin:0 0 1.5mm}
  #stampa .int{display:grid;grid-template-columns:128mm 112mm;gap:.8mm 5mm;font-size:9pt}
  #stampa .int b{font-weight:700}
  #stampa .logo{width:19mm;height:19mm}
  #stampa .cols{display:grid;grid-template-columns:138mm 123mm;gap:12mm;align-items:start}
  #stampa h2{font-size:11pt;margin:0 0 1.2mm;color:#111}
  #stampa .sez{position:relative}
  #stampa .sez svg{width:138mm;height:75mm;display:block}
  #stampa .dati{margin-top:1.5mm;font-size:10pt}
  #stampa .dati div{margin-bottom:.8mm}
  #stampa .tri{position:absolute;left:101mm;top:82mm;width:35mm;height:auto}
  #stampa .fuoriS{color:var(--rosso);font-weight:800;font-size:9pt;text-transform:uppercase;margin-top:1mm}
  #stampa .perc{font-size:19pt}
  #stampa .barra{height:4.5mm;margin:2mm 0}
  #stampa .pesi div{display:block;padding:0}
  #stampa .pesi .tot{border:none;margin:0;padding:0}
  #stampa .nota{font-size:8pt;color:#555;margin-top:1.5mm}
  #stampa table{width:100%;border-collapse:collapse;font-size:9pt}
  #stampa thead{display:table-header-group}
  #stampa th{background:#e9ecef;text-align:right;padding:1.4mm 1mm}
  #stampa td{border-bottom:.2mm solid #ddd;padding:1.3mm 1mm;text-align:right}
  #stampa th:nth-child(2),#stampa td:nth-child(2){text-align:left}
  #stampa td i{display:inline-block;width:3.4mm;height:3.4mm;border:.2mm solid #333}
  #stampa tr{break-inside:avoid}
  #stampa tfoot td{border-top:.4mm solid #333;font-weight:700}
  #stampa .avvisi{margin-top:4mm;color:var(--rosso);font-weight:700;font-size:10.5pt}
  #stampa .avvisi div{margin-bottom:1.5mm}
  #stampa .piede{margin-top:4mm;font-size:9pt;color:#555;text-align:center}
}

</style></head><body>
<div id="splash"><img id="splashLogo" alt="CanalSize"></div>

<header class="top">
  <img id="logoTop" alt="">
  <div><div class="nome">CanalSize</div><div class="slogan">La canala giusta al primo calcolo</div></div>
  <div class="db" id="dbInfo"></div>
</header>

<main>
  <div class="col-sx">
    <details class="card" open id="cardInt">
      <summary>Intestazione</summary>
      <div class="griglia g2">
        <div><label class="et" for="i_cliente">Cliente:</label><input type="text" id="i_cliente" data-int="cliente" autocomplete="off"></div>
        <div><label class="et" for="i_impianto">Impianto:</label><input type="text" id="i_impianto" data-int="impianto" autocomplete="off"></div>
        <div><label class="et" for="i_commessa">Commessa:</label><input type="text" id="i_commessa" data-int="commessa" autocomplete="off"></div>
        <div><label class="et" for="i_revisione">Revisione:</label><input type="text" id="i_revisione" data-int="revisione" autocomplete="off"></div>
        <div class="span2"><label class="et" for="i_progetto">Progetto:</label><input type="text" id="i_progetto" data-int="progetto" autocomplete="off"></div>
      </div>
    </details>

    <section class="card">
      <h2>Canala / passerella</h2>
      <label class="et" for="nomeCanala">Nome canala</label>
      <input type="text" id="nomeCanala" autocomplete="off">
      <div class="chips" id="tipologie" style="margin:10px 0"></div>
      <label class="et" for="dimCanala">Dimensioni [mm]</label>
      <select id="dimCanala"></select>
      <label class="et" style="margin-top:10px">Lavorazione</label>
      <div class="chips" id="lavorazioni"></div>
      <div class="piccolo legenda" id="legendaLav"></div>
    </section>

    <section class="card">
      <h2>Aggiungi cavo</h2>
      <div class="griglia">
        <div><label class="et" for="selTipo">Tipo</label><select id="selTipo"></select></div>
        <div><label class="et" for="selForm">Formazione</label><select id="selForm"></select></div>
        <div class="riga-azione">
          <div><label class="et" for="qtaNuovo">Quantità</label>
            <div class="stepper"><button type="button" id="qtaMeno" aria-label="Diminuisci">−</button>
              <input type="number" id="qtaNuovo" inputmode="numeric" min="1" max="9999" value="1">
              <button type="button" id="qtaPiu" aria-label="Aumenta">+</button></div></div>
          <button type="button" class="btn primario cresce" id="btnAggiungi">Aggiungi</button>
        </div>
        <div class="piccolo" id="infoCavo" style="min-height:18px"></div>
        <div class="rosso" id="avvisoIS" style="min-height:20px"></div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <h2 style="margin:0">Cavi in canala</h2>
        <button type="button" class="btn" id="btnImporta">Importa elenco cavi</button>
      </div>
      <div class="lista" id="lista"></div>
      <div class="rosso" id="avvisoMisto" style="min-height:20px;margin-top:8px"></div>
      <div class="barra-lista"><span class="piccolo">Tocca un cavo per vedere l'immagine</span>
        <button type="button" class="btn pericolo" id="btnSvuota">Svuota elenco</button></div>
    </section>

    <section class="card" id="boxImg">
      <div class="titolo" id="titoloImg">Tipo di cavo</div>
      <img id="imgCavo" alt="" class="nascosto">
      <div class="piccolo" id="noImg">Scegli un tipo di cavo per vedere l'immagine.</div>
      <div class="rosso" id="avvisoISImg" style="min-height:20px;margin-top:6px"></div>
    </section>
  </div>

  <div class="col-dx">
    <section class="card">
      <h2>Risultati</h2>
      <div class="perc" id="perc">—</div>
      <div class="barra"><i id="barraPerc"></i></div>
      <div class="pesi" id="pesi"></div>
      <div class="piccolo" id="notaIngombro" style="margin-top:8px"></div>
    </section>
    <section class="card">
      <h2>Sezione canala (ingombro cavi)</h2>
      <div id="svgBox"></div>
      <div class="legenda-cavi" id="legendaCavi"></div>
      <div id="fuori" class="nascosto"><img id="triangolo" alt="Pericolo"><span id="testoFuori"></span></div>
    </section>
  </div>
</main>

<nav class="azioni">
  <button type="button" id="btnApri"><span>📂</span>Apri</button>
  <button type="button" id="btnSalva"><span>💾</span>Salva</button>
  <button type="button" id="btnDb"><span>🗄️</span>Database</button>
  <button type="button" class="p" id="btnStampa"><span>🖨️</span>Stampa</button>
</nav>

<dialog id="dlg"><div class="corpo"><h3 id="dlgTitolo"></h3><div class="testo" id="dlgTesto"></div></div><div class="bott" id="dlgBott"></div></dialog>

<div id="progresso" class="nascosto"><div class="box"><div id="progTesto">Lettura del file…</div>
  <div class="barra"><i id="progBarra"></i></div><div class="piccolo" id="progPerc">0 %</div></div></div>

<input type="file" id="fileImporta" accept=".xlsx,.xlsm,.csv" hidden>
<input type="file" id="fileApri" accept=".passerella,.json,application/json" hidden>
<input type="file" id="fileDb" accept=".xlsx,.xlsm,.csv" hidden>
<div id="stampa"></div>

function caricaCatalogoDaRighe(righe, scartate) {

/* --- disegno della sezione (SVG) --- */
function svgSezione(L, H, disp, blu, vbW = 460, vbH = 280) {
  const mx = 52, top = 10, bott = 26;
  const sc = Math.min((vbW - 2 * mx) / (L + 2 * COP_S), (vbH - top - bott) / (H + COP_TOT));
  const x0 = (vbW - L * sc) / 2, y0 = top + COP_TOT * sc, yb = y0 + H * sc, t = Math.max(SP * sc, 2.2);
  const [parete, copF, copB] = blu ? ["#1f5fbf", "#a9c8f5", "#1f5fbf"] : ["#555", "#aeb4bc", "#333"];
  const g = n => n.toFixed(2); let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vbW} ${vbH}" font-family="Segoe UI,Arial,sans-serif">`;
  s += `<rect x="${g(x0)}" y="${g(y0)}" width="${g(L * sc)}" height="${g(H * sc)}" fill="#f4f4f4"/>`;
  s += `<rect x="${g(x0)}" y="${g(y0)}" width="${g(t)}" height="${g(H * sc)}" fill="${parete}"/>`;
  s += `<rect x="${g(x0 + L * sc - t)}" y="${g(y0)}" width="${g(t)}" height="${g(H * sc)}" fill="${parete}"/>`;
  s += `<rect x="${g(x0)}" y="${g(yb - t)}" width="${g(L * sc)}" height="${g(t)}" fill="${parete}"/>`;
  const tm = t / sc, alto = -(tm + COP_D), piano = -COP_D, fondo = piano + COP_LAB, Sg = COP_G + tm;
  const pts = [[-Sg, alto], [L + Sg, alto], [L + Sg, fondo], [L + COP_G, fondo], [L + COP_G, piano], [-COP_G, piano], [-COP_G, fondo], [-Sg, fondo]];
  s += `<polygon points="${pts.map(p => g(x0 + p[0] * sc) + "," + g(y0 + p[1] * sc)).join(" ")}" fill="${copF}" stroke="${copB}" stroke-width="1.2"/>`;
  for (const c of disp.colloc) {
    const cx = x0 + (c.x + SP + c.d / 2) * sc, cy = yb - (c.y + SP + c.d / 2) * sc;
    s += `<circle cx="${g(cx)}" cy="${g(cy)}" r="${g(c.d / 2 * sc)}" fill="${PALETTE[c.idx % PALETTE.length]}" stroke="#222" stroke-width="0.8"/>`;
  }
  const y50 = yb - H * sc / 2;
  s += `<line x1="${g(x0 - 4)}" x2="${g(x0 + L * sc + 4)}" y1="${g(y50)}" y2="${g(y50)}" stroke="#c62828" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  s += `<text x="${g(x0 + L * sc + 7)}" y="${g(y50 + 4)}" font-size="11.5" font-weight="700" fill="#c62828">50%</text>`;
  s += `<text x="${g(vbW / 2)}" y="${g(yb + 17)}" font-size="12" fill="#333" text-anchor="middle">${fmt(L, 0)} mm</text>`;
  s += `<text x="${g(x0 - COP_S * sc - 5)}" y="${g(y0 + 14)}" font-size="12" fill="#333" text-anchor="end">${fmt(H, 0)} mm</text></svg>`;
  return s;
}

/* --- importazione di un elenco cavi da Excel --- */
const NUM_RE = "\\d+(?:[.,]\\d+)?";
const FORMAZIONE_RE = () => new RegExp("\\(*\\s*" + NUM_RE + "\\s*\\)*(?:\\s*[xX×gG]\\s*\\(*\\s*" + NUM_RE + "\\s*\\)*)+", "g");

    const esatte = new Map(), conX = new Map();
    for (const [et, d, p] of voci) { const k = normForm(et.split("  (Ø")[0]);
      if (!esatte.has(k)) esatte.set(k, [et, d, p]); const kx = k.replace(/G/g, "X"); if (!conX.has(kx)) conX.set(kx, [et, d, p]); }
    idx[normNome(tipo)] = {tipo, esatte, conX};

  return idx;
}
function trovaTipo(testo, idx) {
  const t = normNome(testo); let best = null;
  for (const tn of Object.keys(idx)) if (tn && t.includes(tn) && (best === null || tn.length > best.length)) best = tn;
  return best;
}
function senzaParentesi(e) {

    for (let k = 0; k < e.length; k++) { liv += (e[k] === "(") - (e[k] === ")"); if (liv === 0 && k < e.length - 1) return e; }
    e = e.slice(1, -1);
  }
  return e;
}

  const m = /^(\d+)X(.+)$/.exec(e);
  if (m) { const r = riconosci(m[2], mappa); if (r) return [r[0], r[1] * parseInt(m[1], 10)]; }

}
async function analizzaElenco(righe, idx, opz, avanz) {
  let colQta = null;

  const totali = new Map(); let riconosciute = 0; const senzaForm = [];
  for (let n = 1; n <= righe.length; n++) {
    if (n % 300 === 0) { if (avanz) avanz(n / righe.length); await tick(); }
    const riga = righe[n - 1], celle = riga.filter(c => c && String(c).trim());
    if (!celle.length) continue;
    let tn = null; for (const c of celle) { tn = trovaTipo(c, idx); if (tn) break; }
    if (!tn) continue;
    if ((opz.ammessi && !opz.ammessi.has(tn)) || (opz.esclusi && opz.esclusi.has(tn))) continue;
    const {tipo, esatte, conX} = idx[tn]; let trovata = null;
    for (const c of celle) {
      const re = FORMAZIONE_RE(); let m;
      while ((m = re.exec(String(c))) !== null) {
        const e = normForm(m[0]); trovata = riconosci(e, esatte) || riconosci(e.replace(/G/g, "X"), conX);
        if (trovata) break; if (m[0] === "") re.lastIndex++;
      }

    }

    if (colQta !== null && colQta < riga.length && n > 1) { const q = Math.floor(Number(String(riga[colQta]).replace(",", "."))); qta = q >= 1 ? q : 1; }
    riconosciute++; const k = tipo + "\u0001" + et; const v = totali.get(k) || {tipo, label: et, d, p, q: 0}; v.q += molt * qta; totali.set(k, v);

const testoFiltro = () => { const t = TIPOLOGIE[S.tipologia]; if (!t) return "";
  let s = `\n\nTipologia «${t.etichetta}»: letto solo il foglio «${t.foglio}»`;
  if (t.ammessi) s += ", solo i tipi OZ-BL-CY, OLFLEX EB CY e FS17XOHR16"; if (t.esclusi) s += ", ignorati i tipi OZ-BL-CY, OLFLEX EB CY e FS17XOHR16"; return s + "."; };
async function importaElenco(file) {
  const tip = TIPOLOGIE[S.tipologia]; progresso(true, "Lettura del file…", 0);
  let fogli = [];
  try {
    const ext = file.name.toLowerCase().split(".").pop(), buf = await file.arrayBuffer();
    if (ext === "xls") throw Object.assign(new Error("Il formato .xls non è supportato: salva il file come .xlsx e riprova."), {avviso: true});
    if (ext === "csv") {
      if (tip) throw Object.assign(new Error(`Serve un file Excel con un foglio di lavoro chiamato «${tip.foglio}»: un file CSV non ha fogli.`), {avviso: true});
      fogli = [{nome: "CSV", righe: parseCsv(decodificaTesto(buf)).slice(0, RIGHE_MAX_IMPORT)}];
    } else {
      const x = leggiXlsx(buf); let elenco = x.fogli;
      if (tip) { elenco = x.fogli.filter(f => f.nome.trim().toLowerCase() === tip.foglio.trim().toLowerCase());
        if (!elenco.length) throw Object.assign(new Error(`Nel file non c'è un foglio di lavoro chiamato «${tip.foglio}».\n\nFogli presenti: ${x.fogli.map(f => "«" + f.nome + "»").join(", ")}`), {avviso: true}); }
      for (let k = 0; k < elenco.length; k++) { fogli.push({nome: elenco[k].nome, righe: x.leggi(elenco[k])}); progresso(true, "Lettura del file…", 40 * (k + 1) / elenco.length); await tick(); }
    }

  const idx = indiceCatalogo(DB.catalogo), risultati = [], totRighe = Math.max(fogli.reduce((s, f) => s + f.righe.length, 0), 1); let fatte = 0;
  for (const f of fogli) {

      fr => progresso(true, `Analisi del foglio «${f.nome}»…`, 40 + 60 * (base + fr * n) / totRighe));
    fatte += n; risultati.push({nome: f.nome, ...r});

  const buoni = risultati.filter(r => r.riconosciute > 0);
  if (!buoni.length) { await avviso("Importa elenco cavi", "Non ho trovato cavi con tipo e formazione presenti nel database.\n\nPer ogni riga servono almeno il tipo di cavo e la formazione, uguali a quelli del database." + testoFiltro()); return; }
  const totali = new Map(); let riconosciute = 0; const senza = [];

  const inConf = [...totali.values()].filter(v => conflittoTipologia(S.tipologia, v.tipo)).map(v => v.tipo);
  if (inConf.length) { const ok = await siNo("Attenzione", conflittoTipologia(S.tipologia, inConf[0]) + "\n\nCavi interessati: " + [...new Set(inConf)].sort().join(", ") + "\n\nVuoi importare comunque?"); if (!ok) return; }
  let sostituisci = true;
  if (S.voci.length) { const r = await dialogo("Importa elenco cavi", "La tabella contiene già dei cavi.", [
    {t: "Annulla", v: null, annulla: true}, {t: "Aggiungi", v: false}, {t: "Sostituisci", v: true, primario: true}]); if (r === null) return; sostituisci = r; }
  const nuove = sostituisci ? [] : S.voci;
  for (const v of totali.values()) { const e = nuove.find(x => x.tipo === v.tipo && x.label === v.label); if (e) e.q += v.q; else nuove.push({...v}); }
  S.voci = nuove; S.sel = -1; renderLista(); aggiorna();

  msg += "\n\nFogli con cavi: " + buoni.map(r => `«${r.nome}» (${r.riconosciute} righe)`).join(", ");

async function caricaDbDaFile(file) {
  try {
    const ext = file.name.toLowerCase().split(".").pop(), buf = await file.arrayBuffer(); let righe, oltre = false;
    if (ext === "xls") throw new Error("Il formato .xls non è supportato: salva il file come .xlsx.");
    if (ext === "csv") { const tutte = parseCsv(decodificaTesto(buf)); oltre = tutte.slice(RIGHE_MAX_DB).some(r => r.some(c => String(c).trim())); righe = tutte.slice(0, RIGHE_MAX_DB); }
    else { const x = leggiXlsx(buf); const tutte = x.leggi(x.fogli[0]); oltre = tutte.slice(RIGHE_MAX_DB).some(r => r.some(c => String(c).trim())); righe = tutte.slice(0, RIGHE_MAX_DB); }

    await avviso("Database", msg);

}

  ${margini ? "" : `<div class="piede">${esc(piede.sx)}   |   ${esc(piede.c)}</div>`}`;
  let st = document.getElementById("stileStampa"); if (!st) { st = document.createElement("style"); st.id = "stileStampa"; document.head.appendChild(st); }
  const q = t => '"' + t.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"', stile = "font:9pt 'Segoe UI',Arial,sans-serif;color:#555;";
  st.textContent = margini ? `@page{@bottom-left{content:${q(piede.sx)};${stile}}@bottom-center{content:${q(piede.c)};${stile}}}` : "";
  window.onafterprint = () => { $("stampa").innerHTML = ""; };
  setTimeout(() => window.print(), 80);
}

/* --- avvio --- */
function collega() {
  document.querySelectorAll("[data-int]").forEach(i => i.oninput = () => { S.intest[i.dataset.int] = i.value; autosalva(); });
  $("nomeCanala").oninput = e => { S.tag = e.target.value; autosalva(); };
  $("dimCanala").onchange = e => { S.canala = e.target.value; aggiorna(); };
  $("selTipo").onchange = e => { S.tipoSel = e.target.value; S.formSel = ""; S.imgTipo = S.tipoSel; popolaForm(); renderImmagine(); };
  $("selForm").onchange = e => { S.formSel = e.target.value; infoCavo(); };
  const q = $("qtaNuovo"); const setq = n => q.value = Math.max(1, Math.min(9999, n || 1));
  $("qtaMeno").onclick = () => setq((parseInt(q.value, 10) || 1) - 1); $("qtaPiu").onclick = () => setq((parseInt(q.value, 10) || 0) + 1);
  q.onchange = () => setq(parseInt(q.value, 10));
  $("btnAggiungi").onclick = aggiungi;
  $("btnSvuota").onclick = async () => { if (S.voci.length && await siNo("Svuota elenco", "Vuoi togliere tutti i cavi dall'elenco?", false)) { S.voci = []; S.sel = -1; renderLista(); aggiorna(); } };
  $("btnImporta").onclick = () => $("fileImporta").click();
  $("fileImporta").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importaElenco(f); };
  $("btnApri").onclick = () => $("fileApri").click();
  $("fileApri").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) apri(f); };
  $("fileDb").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) caricaDbDaFile(f); };
  $("btnSalva").onclick = salva; $("btnStampa").onclick = stampa; $("btnDb").onclick = menuDb;
}
function avvia() {
  $("splashLogo").src = D.logo; $("logoTop").src = D.logo; $("triangolo").src = D.pericolo;
  try { const db = JSON.parse(localStorage.getItem("canalsize_db") || "null"); if (db && db.catalogo && db.dimensioni) DB = db; } catch (e) {}
  S.canala = DB.dimensioni[0] || "";
  try { const st = JSON.parse(localStorage.getItem("canalsize_stato") || "null"); if (st) applicaStato(st); } catch (e) {}
  creaChips(); collega(); popolaTipi(); sincCampi(); infoDb(); renderLista(); aggiorna();
  const sp = $("splash"), chiudi = () => { sp.classList.add("via"); setTimeout(() => sp.remove(), 500); };
  sp.onclick = chiudi; setTimeout(chiudi, 3000);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
}
document.addEventListener("DOMContentLoaded", avvia);

</script></body></html>
